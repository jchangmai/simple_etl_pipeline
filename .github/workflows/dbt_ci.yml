name: dbt Cloud CI/CD Automation

on:
  push:
    branches: [ main ]
    paths:
      - 'dbt_aim/**'

jobs:
  trigger-dbt-cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger dbt Cloud Job
        env:
          DBT_ACCOUNT_ID: ${{ secrets.DBT_ACCOUNT_ID }}
          DBT_JOB_ID: ${{ secrets.DBT_JOB_ID }}
          DBT_API_TOKEN: ${{ secrets.DBT_API_TOKEN }}
        run: |
          curl --request POST \
            --url "https://iw630.us1.dbt.com/api/v2/accounts/${DBT_ACCOUNT_ID}/jobs/${DBT_JOB_ID}/run/" \
            --header "Authorization: Token ${DBT_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"cause": "GitHub Actions CI on ${{ github.sha }}"}'